name: publish

# Publishes @expanse-ade/mcp to the PUBLIC npmjs registry on a version tag (v*),
# or manually via workflow_dispatch. Scoped packages publish public via
# publishConfig.access=public, so anyone can `npm install` it with no auth.
#
# Auth = an npm token in secrets.NPM_TOKEN (npmjs.com -> Access Tokens ->
# Granular Access Token with Read+Write on the @expanse-ade scope, or a classic
# Automation token). setup-node's registry-url writes ~/.npmrc wiring
# NODE_AUTH_TOKEN so `pnpm publish` authenticates as the token owner.
#
# CAVEAT: npm tokens EXPIRE. When the token lapses this workflow fails at the
# publish step with ENEEDAUTH (as it did for 0.9.1) -- rotate the secret before
# the chosen lifetime ends. A token-free alternative (npm Trusted Publishing /
# OIDC) is documented in docs/handoffs/2026-06-14-publish-oidc-token-handling.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
