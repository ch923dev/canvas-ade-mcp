name: publish

# Publishes @expanse-ade/mcp to the PUBLIC npmjs registry on a version tag (v*),
# or manually via workflow_dispatch.
#
# Auth = npm Trusted Publishing (OIDC) — there is NO long-lived NPM_TOKEN secret.
# GitHub Actions mints a short-lived, workflow-scoped OIDC token (needs the
# `id-token: write` permission below); npm CLI >= 11.5.1 detects it and exchanges it
# for publish rights against the trusted publisher registered for this package on
# npmjs.com (org `ch923dev`, repo `canvas-ade-mcp`, workflow `publish.yml`). npm also
# attaches a build-provenance attestation. Scoped package publishes public via
# publishConfig.access=public, so anyone can `npm install` it with no auth.
#
# NOTE: pnpm (pinned 9.x) has no OIDC support yet, so the publish step uses `npm`
# directly while pnpm still drives install/typecheck/test/build. Node 22 ships npm
# 10.x, below the 11.5.1 OIDC floor, so npm is upgraded in the runner first.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required: lets the runner mint the OIDC token for trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22 # resolves to >= 22.14.0, the OIDC floor (no registry-url: OIDC needs no .npmrc auth)
          package-manager-cache: false # v5 defaults this true → it auto-detects pnpm and caches before corepack installs it
      # OIDC trusted publishing needs npm CLI >= 11.5.1; Node 22 bundles 10.x. Pinned to 11.x:
      # npm@latest resolved to 12.0.0 on 2026-07-09 and broke publish on the runner
      # (MODULE_NOT_FOUND 'sigstore' from libnpmpublish's provenance path — v0.18.1 run 29024870578).
      - run: npm install -g npm@11.18.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # OIDC: no NODE_AUTH_TOKEN / .npmrc auth. --provenance is explicit (also npm's default under OIDC).
      # A PRERELEASE version (e.g. 0.18.0-rc.1) may NOT publish to the default `latest` dist-tag —
      # npm >= 11 hard-errors ("must specify a tag using --tag when publishing a prerelease"). Route a
      # prerelease (version contains `-`) to the `next` dist-tag so `latest` keeps pointing at the
      # newest STABLE release; a stable version publishes to `latest` as before.
      - name: publish (prerelease → next, stable → latest)
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease $VERSION → dist-tag next"
            npm publish --provenance --access public --tag next
          else
            echo "stable $VERSION → dist-tag latest"
            npm publish --provenance --access public
          fi
