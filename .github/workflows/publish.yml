name: publish

# Publishes @ch923dev/canvas-ade-mcp to the PUBLIC npmjs registry on a version tag
# (v*), or manually via workflow_dispatch. Scoped packages publish public via
# publishConfig.access=public. Auth uses an npm automation token in secrets.NPM_TOKEN
# (npmjs → Access Tokens → Automation). No GitHub Packages / GITHUB_TOKEN needed —
# anyone can `npm install` this with no auth.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # Writes ~/.npmrc pointing the default registry at npmjs and wiring
          # NODE_AUTH_TOKEN so pnpm publish authenticates as the token owner.
          registry-url: https://registry.npmjs.org
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
